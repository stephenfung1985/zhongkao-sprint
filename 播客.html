<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中考三十分钟电台</title>
<link rel="stylesheet" href="css/style.css">
<script>
  /* 和主页面同一套主题记忆，避免切过去闪一下白 */
  (function(){
    var t = localStorage.getItem("zk2027_theme");
    if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  .pod-wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}

  .pod-hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:22px;margin-bottom:22px;
  }
  .pod-eyebrow{font-size:12px;color:var(--ink2);letter-spacing:.4px;margin-bottom:6px}
  .pod-title{font-size:22px;font-weight:800;line-height:1.4;margin:0 0 12px}
  .pod-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{
    font-size:12px;padding:3px 10px;border-radius:99px;
    background:var(--tag-bg);color:var(--tag-fg);white-space:nowrap;
  }
  .chip.acc{background:var(--acc-soft);color:var(--acc)}
  .chip.ok{background:var(--ok-soft);color:var(--ok)}

  audio{width:100%;display:block;margin-bottom:6px}

  .pod-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .pod-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:7px 14px;border-radius:99px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .pod-btn:hover{border-color:var(--acc);color:var(--acc)}
  .pod-btn.on{background:var(--invert-bg);color:var(--invert-fg);border-color:transparent}

  .pod-note{font-size:13px;color:var(--ink2);line-height:1.7;margin-top:14px}

  /* ---- 文稿 ---- */
  .script{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
  .line{
    display:flex;gap:10px;padding:7px 10px;border-radius:10px;
    cursor:pointer;transition:background .12s;scroll-margin:90px;
  }
  .line:hover{background:var(--tint)}
  .line.now{background:var(--acc-soft)}
  .line.now .who{color:var(--acc)}
  .who{flex:none;width:38px;font-size:12px;color:var(--ink2);padding-top:3px;font-weight:600}
  .say{flex:1;font-size:15px;line-height:1.8}
  .line.gap{color:var(--ink2);font-size:13px;font-style:italic;cursor:default}
  .line.gap:hover{background:transparent}

  /* ---- 往期 ---- */
  .pod-list h2{font-size:15px;color:var(--ink2);font-weight:600;margin:0 0 10px}
  .ep{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;cursor:pointer;transition:.15s;
  }
  .ep:hover{border-color:var(--acc);transform:translateX(2px)}
  .ep-no{
    flex:none;width:44px;height:44px;border-radius:11px;background:var(--surface2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;line-height:1;
  }
  .ep-no small{font-size:9px;font-weight:500;color:var(--ink2);margin-top:2px}
  .ep-main{flex:1;min-width:0}
  .ep-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ep-s{font-size:12px;color:var(--ink2);margin-top:2px}
  .ep-badge{flex:none;font-size:11px;color:var(--ink2)}

  .empty{
    background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
    padding:28px 22px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.9;
  }
  .empty code{
    background:var(--surface2);padding:2px 7px;border-radius:5px;
    font-size:13px;color:var(--ink);
  }

  @media(max-width:560px){
    .pod-title{font-size:19px}
    .who{width:32px;font-size:11px}
    .say{font-size:14px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">中考三十分钟电台</span>
  </div>
  <div class="countdown">
    <span class="cd-num" id="cdNum">—</span>
    <span class="cd-label">天<br>后中考</span>
  </div>
  <button class="theme-btn" id="themeBtn" title="亮色 / 暗色">
    <svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         style="display:none">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
  </button>
</header>

<div class="tabs">
  <a class="tab" href="index.html">← 回学习平台</a>
  <button class="tab active">播客</button>
</div>

<main class="pod-wrap">
  <div id="app"><div class="empty">正在读节目单…</div></div>
</main>

<script>
const $ = id => document.getElementById(id);

/* ---- 主题：和主页面同一套开关 ---- */
const THEME_KEY = "zk2027_theme";
function curTheme(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
$("themeBtn").onclick = () => {
  const next = curTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
};

function fmtSec(s){
  if (!s && s !== 0) return "";
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return m + " 分 " + String(r).padStart(2, "0") + " 秒";
}

/* ============================================================
   加载节目单
   ============================================================ */
let LIST = [];

async function boot(){
  let idx;
  try {
    const r = await fetch("播客/节目单.json?" + Date.now());
    if (!r.ok) throw new Error(r.status);
    idx = await r.json();
  } catch (e) {
    $("app").innerHTML = `
      <div class="empty">
        还没有节目单。<br><br>
        双击项目根目录的 <code>每日播客.bat</code> 生成第一期，<br>
        或者在命令行里跑 <code>node 播客/生成文稿.js</code>。<br><br>
        <span style="font-size:12px">
          另外：这个页面要通过 <code>启动学习平台.bat</code> 打开才能读到文件，<br>
          直接双击 html 是读不到的。
        </span>
      </div>`;
    return;
  }

  LIST = (idx.episodes || []).filter(e => e.hasAudio);
  const pending = (idx.episodes || []).filter(e => !e.hasAudio);

  if (!LIST.length){
    $("app").innerHTML = `
      <div class="empty">
        文稿已经生成了 ${pending.length} 期，但还没有音频。<br><br>
        在命令行里跑一次 <code>python 播客/合成音频.py</code> 就有了。<br>
        <span style="font-size:12px">（合成需要联网，一期大约几分钟）</span>
      </div>`;
    return;
  }

  if (LIST[0]) $("cdNum").textContent = LIST[0].daysLeft;
  render(0);
}

/* ============================================================
   渲染某一期
   ============================================================ */
async function render(i){
  const ep = LIST[i];
  const rest = LIST.filter((_, k) => k !== i);

  $("app").innerHTML = `
    <section class="pod-hero">
      <div class="pod-eyebrow">
        ${ep.date} · ${ep.weekday} · 第 ${ep.dayNo} 天 · 距中考 ${ep.daysLeft} 天
      </div>
      <h1 class="pod-title">${ep.title}</h1>
      <div class="pod-meta">
        <span class="chip acc">${fmtSec(ep.actualSeconds || ep.estMinutes * 60)}</span>
        <span class="chip">本期讲题 ${(ep.counts && ep.counts.本期讲题) || 0} 道</span>
        <span class="chip">错题本未攻克 ${(ep.counts && ep.counts.错题本总数) || 0} 道</span>
        <span class="chip ok">技巧：${ep.tip || "—"}</span>
      </div>

      <audio id="au" controls preload="metadata"
             src="播客/音频/${ep.date}.mp3"></audio>

      <div class="pod-actions">
        <button class="pod-btn" id="btnScript">📄 显示文稿</button>
        <button class="pod-btn" id="btnFollow">🎯 跟读高亮：开</button>
        <a class="pod-btn" style="text-decoration:none"
           href="播客/音频/${ep.date}.mp3" download>⬇ 存到手机</a>
      </div>

      <div class="pod-note">
        晚饭时候放着听就行，不用做笔记。节目里问问题的地方会留几秒空白，
        在心里答一下就够了 —— 想不起来的那些，正好是今晚该补的。
      </div>

      <div class="script" id="script" hidden></div>
    </section>

    <section class="pod-list">
      <h2>往期（共 ${LIST.length} 期）</h2>
      ${rest.map(e => `
        <div class="ep" data-date="${e.date}">
          <div class="ep-no">${e.dayNo}<small>第${e.dayNo}天</small></div>
          <div class="ep-main">
            <div class="ep-t">${e.title}</div>
            <div class="ep-s">${e.date} · ${fmtSec(e.actualSeconds || e.estMinutes*60)} · ${e.tip || ""}</div>
          </div>
          <div class="ep-badge">▶</div>
        </div>`).join("")}
    </section>
  `;

  document.querySelectorAll(".ep").forEach(el => {
    el.onclick = () => {
      const k = LIST.findIndex(x => x.date === el.dataset.date);
      if (k >= 0) { render(k); scrollTo({ top: 0, behavior: "smooth" }); }
    };
  });

  setupScript(ep);
}

/* ============================================================
   文稿 + 跟读高亮

   每一段的起止秒数是合成音频的时候数出来写进 json 的（帧数 × 24 毫秒），
   所以高亮是精确对齐的，不是估的。点一行可以直接跳到那一句。
   ============================================================ */
async function setupScript(ep){
  const box = $("script"), au = $("au");
  const btn = $("btnScript"), btnF = $("btnFollow");
  let follow = true, loaded = false, segs = [];

  btnF.classList.add("on");
  btnF.onclick = () => {
    follow = !follow;
    btnF.classList.toggle("on", follow);
    btnF.textContent = "🎯 跟读高亮：" + (follow ? "开" : "关");
  };

  btn.onclick = async () => {
    if (!loaded){
      btn.textContent = "读取中…";
      try {
        const r = await fetch(`播客/文稿/${ep.date}.json?` + Date.now());
        segs = (await r.json()).segments || [];
      } catch(e){
        box.innerHTML = `<div class="empty">文稿读不出来</div>`;
        box.hidden = false; return;
      }
      box.innerHTML = segs.map((s, i) =>
        s.v === "GAP"
          ? `<div class="line gap" data-i="${i}">⏸ 留白 ${s.gap} 秒 —— 在心里答一下</div>`
          : `<div class="line" data-i="${i}">
               <div class="who">${s.v === "F" ? "晓晓" : "云希"}</div>
               <div class="say">${s.t}</div>
             </div>`
      ).join("");
      box.querySelectorAll(".line").forEach(el => {
        el.onclick = () => {
          const s = segs[+el.dataset.i];
          if (s && typeof s.at === "number") { au.currentTime = s.at; au.play(); }
        };
      });
      loaded = true;
    }
    box.hidden = !box.hidden;
    btn.textContent = box.hidden ? "📄 显示文稿" : "📄 收起文稿";
  };

  let lastEl = null;
  au.addEventListener("timeupdate", () => {
    if (!loaded || box.hidden || !follow) return;
    const t = au.currentTime;
    const i = segs.findIndex(s => typeof s.at === "number" && t >= s.at && t < s.end);
    if (i < 0) return;
    const el = box.querySelector(`.line[data-i="${i}"]`);
    if (!el || el === lastEl) return;
    if (lastEl) lastEl.classList.remove("now");
    el.classList.add("now");
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    lastEl = el;
  });
}

boot();
</script>
</body>
</html>
